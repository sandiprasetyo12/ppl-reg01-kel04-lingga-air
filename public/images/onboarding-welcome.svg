<svg class="w-64 h-52 mx-auto" viewBox="0 0 280 220" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Soft organic backdrop shape -->
    <path d="M50 110C35 60 70 20 135 15C200 10 245 45 240 105C235 165 195 205 130 205C65 205 65 160 50 110Z" fill="#EBF5FB"/>
    <ellipse cx="140" cy="195" rx="90" ry="8" fill="#D0E7F5" fill-opacity="0.7"/>

    <!-- Potted Plant on the Left (like Scala) -->
    <ellipse cx="70" cy="186" rx="14" ry="4" fill="#CBD5E1"/>
    <path d="M62 166 L65 186 L75 186 L78 166 Z" fill="#FFFFFF" stroke="#334155" stroke-width="1.8"/>
    <!-- Plant Leaves -->
    <path d="M70 166 C70 145 54 138 52 133 C60 140 68 146 70 166 Z" fill="#10B981" stroke="#047857" stroke-width="1.5"/>
    <path d="M70 166 C70 140 78 130 86 128 C82 138 76 148 70 166 Z" fill="#059669" stroke="#047857" stroke-width="1.5"/>
    <path d="M70 166 C70 148 66 120 70 115 C74 125 72 145 70 166 Z" fill="#34D399" stroke="#047857" stroke-width="1.5"/>

    <!-- Community Water Stand & Reservoir (Center) -->
    <!-- Wooden / Metal Stand Legs -->
    <rect x="100" y="145" width="80" height="42" rx="4" fill="#F8FAFC" stroke="#004F7D" stroke-width="2"/>
    <line x1="118" y1="145" x2="118" y2="187" stroke="#BAE3F5" stroke-width="2"/>
    <line x1="140" y1="145" x2="140" y2="187" stroke="#BAE3F5" stroke-width="2"/>
    <line x1="162" y1="145" x2="162" y2="187" stroke="#BAE3F5" stroke-width="2"/>
    <line x1="100" y1="166" x2="180" y2="166" stroke="#004F7D" stroke-width="1.5"/>

    <!-- Water Tank (Main Deep Blue #00629B) -->
    <rect x="106" y="65" width="68" height="80" rx="14" fill="#00629B" stroke="#003B5C" stroke-width="2.5"/>
    <!-- Tank Lid -->
    <rect x="118" y="58" width="44" height="8" rx="3" fill="#003B5C"/>
    
    <!-- Water Level Indicator Glass Tube -->
    <rect x="160" y="80" width="7" height="48" rx="3" fill="#FFFFFF" stroke="#003B5C" stroke-width="1.5"/>
    <rect x="161.5" y="94" width="4" height="32" rx="2" fill="#38BDF8"/>

    <!-- Droplet Insignia on Tank -->
    <path d="M138 88 C138 88 126 103 126 112 C126 119 131.5 124 138 124 C144.5 124 150 119 150 112 C150 103 138 88 138 88 Z" fill="#FFFFFF"/>
    <path d="M138 94 C138 94 130 105 130 112 C130 116 133 120 138 120 C139.5 120 134.5 114 134.5 110 C134.5 104 138 94 138 94 Z" fill="#BAE3F5"/>

    <!-- Small Table / Bench on the Right with Tap & Jari-jari -->
    <path d="M200 156 L218 156 L218 187 L200 187 Z" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
    <!-- Pipe & Clean Water Faucet -->
    <path d="M174 125 L196 125 L196 142 L192 142" stroke="#004F7D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M192 140 L192 146" stroke="#00629B" stroke-width="3" stroke-linecap="round"/>
    <!-- Droplet from Faucet -->
    <circle cx="192" cy="153" r="2.5" fill="#0284C7"/>
    <!-- Small Gallon / Water Jug -->
    <rect x="185" y="165" width="14" height="22" rx="3" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.8"/>
    <rect x="189" y="160" width="6" height="5" rx="1.5" fill="#0284C7"/>
</svg>
